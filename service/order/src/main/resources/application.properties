spring.application.name=order-service
spring.config.import=optional:configserver:http://localhost:8888

# OpenFeign Timeouts
feign.client.config.default.connect-timeout=2000
feign.client.config.default.read-timeout=5000
feign.client.config.product-service.connect-timeout=2000
feign.client.config.product-service.read-timeout=5000
feign.client.config.user-service.connect-timeout=2000
feign.client.config.user-service.read-timeout=5000

# Enable Resilience4j CircuitBreaker for OpenFeign
feign.circuitbreaker.enabled=true

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3000ms
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.product-service.base-config=default
resilience4j.circuitbreaker.instances.user-service.base-config=default

